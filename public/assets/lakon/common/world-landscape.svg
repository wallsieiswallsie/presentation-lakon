    <path id="service-street" d="M-80 1010C480 650 1040 390 1630 520S2450 650 2540 960Q2670 1340 2740 1670T3260 2000"/>
    <path id="arrival-walk" d="M1460 2480C1450 2050 1470 1760 1570 1510S1610 1110 1535 800"/>
