  <g><use href="#lamp" x="1390" y="1760"/><use href="#lamp" x="1705" y="1760"/><use href="#lamp" x="1410" y="1530"/><use href="#lamp" x="1750" y="1530"/><use href="#lamp" x="1300" y="1210"/><use href="#lamp" x="1840" y="1260"/><use href="#lamp" x="1660" y="1020"/></g>
