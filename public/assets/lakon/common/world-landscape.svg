  </defs>
  <!-- A continuous pedestrian district on the existing 3200 × 2400 camera canvas. -->
  <rect width="3200" height="2400" fill="#e3ddc6"/>
  <path d="M580 460Q1030 225 1550 350T2590 530L2680 1300Q2580 1550 2070 1490L1830 2070 720 2130 510 1360Z" fill="#d0d1b1"/>
  <path d="M900 640Q1240 500 1560 555L1830 1010 1580 1130 1090 1080 870 890Z M1900 570L2340 580 2490 1080 2180 1230 1940 1080Z M1030 1300L1320 1380 1160 1790 910 1690Z M1810 1430L2080 1360 2190 1710 1780 1870Z" fill="#c0c7a5"/>
  <!-- Service street stays secondary to the broad cream arrival walk. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#service-street" stroke="#c9bea3" stroke-width="90"/>
    <use href="#service-street" stroke="#ded3b8" stroke-width="76"/>
    <use href="#service-street" stroke="#efe9d5" stroke-width="3" stroke-dasharray="20 23"/>
  </g>
  <!-- Main route: gate → shared plaza → café; branches reach each service frontage. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- All borders first, then surfaces: junctions have no border crossing them. -->
    <use href="#arrival-walk" stroke="#baab89" stroke-width="154"/>
    <use href="#scenario-walks" stroke="#baab89" stroke-width="66"/>
    <ellipse cx="1580" cy="1265" rx="224" ry="126" fill="#baab89"/>
    <use href="#arrival-walk" stroke="url(#paving)" stroke-width="140"/>
    <ellipse cx="1580" cy="1265" rx="217" ry="119" fill="url(#paving)"/>
    <use href="#scenario-walks" stroke="#eee3cb" stroke-width="56"/>
  </g>
